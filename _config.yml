# ==========================================
# Site Settings
# ==========================================
title: "JTRM"
description: "Jesse Rego-Martin"
author: ""
email: ""

# ==========================================
# URL & Path Settings (CRITICAL FOR GITHUB PAGES)
# ==========================================
# If your repo is "username.github.io", leave baseurl as "".
# If your repo is "my-project", change baseurl to "/my-project".
baseurl: ""
url: "https://jtrm-info.github.io"

# ==========================================
# Theme and Plugins
# ==========================================
# Use 'theme' for officially supported themes (e.g., jekyll-theme-minimal)
# Use 'remote_theme' to fetch any public theme from a GitHub repository
# remote_theme: "pages-themes/slate"
theme: minima

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# ==========================================
# Build behaviour
# ==========================================
# Pretty post URLs: /2026/08/23/testing-123/
permalink: /:year/:month/:day/:title/

# Set this so posts written "today" aren't accidentally treated as future-dated.
timezone: America/New_York

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
